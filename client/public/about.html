<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>XingYi的个人介绍卡片</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
            --bg-page: #f0f0f0;
            --bg-card: #ffffff;
            --bg-raised: #f0f0f0;
            --ink: #111111;
            --ink-soft: #555555;
            --ink-faint: #969696;
            --accent: #111111;
            --accent-dim: #c2c2c2;
            --line: #e2e2e2;
            --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
            --display: "Space Grotesk", -apple-system, "PingFang SC", sans-serif;
            --body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-page);
            background-image:
                radial-gradient(circle at 1px 1px, rgba(17,17,17,0.08) 1px, transparent 0);
            background-size: 22px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: var(--body);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 28px 26px 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 24px 60px -28px rgba(0,0,0,0.18);
        }

        .eyebrow-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .eyebrow b { color: var(--accent); font-weight: 500; }

        .social-icons {
            display: flex;
            gap: 6px;
        }

        .social-icons .icon-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-raised);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .card-header {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 20px;
        }

        .avatar-wrap {
            position: relative;
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ripple {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--accent-dim);
            opacity: 0;
            animation: ripple 3.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }

        .ripple.r2 { animation-delay: 1.2s; }
        .ripple.r3 { animation-delay: 2.4s; }

        @keyframes ripple {
            0%   { transform: scale(0.78); opacity: 0; }
            15%  { opacity: 0.55; }
            100% { transform: scale(1.55); opacity: 0; }
        }

        .avatar-container {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid var(--accent-dim);
            background: var(--bg-raised);
            z-index: 1;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .name-block {
            padding-bottom: 4px;
        }

        .name {
            font-family: var(--display);
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.1;
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .name .bracket {
            font-family: var(--mono);
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 500;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .tag {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.03em;
            color: var(--ink);
            background: var(--bg-raised);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 10px;
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 0 0 18px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--ink-soft);
        }

        .info-item .ico {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-top: 1px;
        }

        .info-item.quote {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--ink-faint);
        }

        .info-item .zen {
            color: var(--accent);
            font-weight: 600;
        }

        .gh-link {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg-raised);
            border: 1px solid var(--line);
            text-decoration: none;
        }

        .gh-link .gh-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gh-link svg { width: 16px; height: 16px; fill: var(--ink-soft); }

        .gh-link .gh-handle {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--ink);
        }

        .gh-link .gh-arrow {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-faint);
        }

        .signature {
            margin-top: 18px;
            text-align: center;
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: 0.08em;
            color: var(--ink-faint);
            opacity: 0.7;
        }

        @media (prefers-reduced-motion: reduce) {
            .ripple { animation: none; opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="eyebrow-row">
            <span class="eyebrow">PROFILE · <b>depth: ∞</b></span>
            <div class="social-icons">
                <span class="icon-badge">💬</span>
                <span class="icon-badge">🔗</span>
            </div>
        </div>

        <div class="card-header">
            <div class="avatar-wrap">
                <span class="ripple r1"></span>
                <span class="ripple r2"></span>
                <span class="ripple r3"></span>
                <div class="avatar-container">
                    <img src="https://q1.qlogo.cn/g?b=qq&nk=3281135771&s=640" alt="XingYi的头像">
                </div>
            </div>
            <div class="name-block">
                <h2 class="name">XingYi <span class="bracket">{ }</span></h2>
            </div>
        </div>

        <div class="tags">
            <span class="tag">DeepOne · CEO</span>
            <span class="tag">Developer</span>
            <span class="tag">China</span>
        </div>

        <div class="divider"></div>

        <div class="info-list">
            <div class="info-item"><span class="ico">👋</span><span>哈喽我是 XingYi</span></div>
            <div class="info-item"><span class="ico">🧩</span><span>DeepOne 工作室｜<span class="zen">递归禅师</span>｜计算机</span></div>
            <div class="info-item quote"><span class="ico">&gt;</span><span>驰骋于计算机领域</span></div>
            <div class="info-item"><span class="ico">✨</span><span>Write everything.</span></div>
        </div>

        <a class="gh-link" href="https://github.com/xing6yi" target="_blank" rel="noopener">
            <span class="gh-left">
                <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                <span class="gh-handle">GitHub @xing6yi</span>
            </span>
            <span class="gh-arrow">↗</span>
        </a>

        <div class="signature">DEEPONE · STILL WATER RUNS DEEP</div>
    </div>
</body>
</html>
